# Local chat config. Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.17
cache: true

interface:
  customWelcome: "Welcome to NexusX, {{user.name}}"

# Shortcuts in the model menu. The full provider lists stay available.
modelSpecs:
  prioritize: false
  list:
    - name: grok-4.7
      label: Grok 4.7
      description: xAI, with your own key
      softDefault: true
      preset:
        endpoint: xai
        model: grok-4.7
    - name: claude
      label: Claude
      description: Anthropic, with your own key
      preset:
        endpoint: anthropic
        model: claude-fable-5
    - name: gpt
      label: GPT
      description: OpenAI, with your own key
      preset:
        endpoint: openAI
        model: gpt-5.6
    - name: gemini
      label: Gemini
      description: Google, with your own key
      preset:
        endpoint: google
        model: gemini-3.8-flash
    - name: openrouter
      label: OpenRouter
      description: Many models through one OpenRouter key
      preset:
        endpoint: OpenRouter
        model: openai/gpt-6-luna

endpoints:
  custom:
    - name: xai
      apiKey: "${XAI_API_KEY}"
      baseURL: https://api.x.ai/v1
      models:
        default:
          - grok-4.7
          - grok-4.3
        fetch: true
      titleConvo: true
      titleModel: grok-4.7
      modelDisplayLabel: Grok

    - name: OpenRouter
      apiKey: "${OPENROUTER_KEY}"
      baseURL: https://openrouter.ai/api/v1
      models:
        default:
          - openai/gpt-6-luna
          - openai/gpt-6-astra
          - anthropic/claude-fable-5
          - x-ai/grok-4.7
          - google/gemini-3.8-flash
        fetch: true
      titleConvo: true
      titleModel: openai/gpt-6-luna
      dropParams: ["stop"]
      modelDisplayLabel: OpenRouter

    # Any OpenAI-compatible API. The user enters the base URL and key.
    - name: Custom API
      apiKey: user_provided
      baseURL: user_provided
      models:
        default:
          - gpt-4o
        fetch: true
      titleConvo: true
      titleModel: gpt-4o
      modelDisplayLabel: Custom
